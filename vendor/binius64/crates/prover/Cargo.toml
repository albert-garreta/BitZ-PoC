[package]
name = "binius-prover"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
binius-compute = { git = "https://github.com/wu-s-john/binius64.git", rev = "2b27daea4a893fab930259cc7ad59d0a37c2ef95" }
binius-core = { git = "https://github.com/wu-s-john/binius64.git", rev = "2b27daea4a893fab930259cc7ad59d0a37c2ef95" }
binius-field = { git = "https://github.com/wu-s-john/binius64.git", rev = "2b27daea4a893fab930259cc7ad59d0a37c2ef95" }
binius-hash = { git = "https://github.com/wu-s-john/binius64.git", rev = "2b27daea4a893fab930259cc7ad59d0a37c2ef95" }
binius-ip = { git = "https://github.com/wu-s-john/binius64.git", rev = "2b27daea4a893fab930259cc7ad59d0a37c2ef95" }
binius-iop = { git = "https://github.com/wu-s-john/binius64.git", rev = "2b27daea4a893fab930259cc7ad59d0a37c2ef95" }
binius-iop-prover = { git = "https://github.com/wu-s-john/binius64.git", rev = "2b27daea4a893fab930259cc7ad59d0a37c2ef95", default-features = false }
binius-ip-prover = { git = "https://github.com/wu-s-john/binius64.git", rev = "2b27daea4a893fab930259cc7ad59d0a37c2ef95", default-features = false }
binius-math = { git = "https://github.com/wu-s-john/binius64.git", rev = "2b27daea4a893fab930259cc7ad59d0a37c2ef95" }
binius-spartan-frontend = { git = "https://github.com/wu-s-john/binius64.git", rev = "2b27daea4a893fab930259cc7ad59d0a37c2ef95" }
binius-spartan-prover = { git = "https://github.com/wu-s-john/binius64.git", rev = "2b27daea4a893fab930259cc7ad59d0a37c2ef95", default-features = false }
binius-transcript = { git = "https://github.com/wu-s-john/binius64.git", rev = "2b27daea4a893fab930259cc7ad59d0a37c2ef95" }
binius-verifier = { path = "../verifier" }
binius-utils = { git = "https://github.com/wu-s-john/binius64.git", rev = "2b27daea4a893fab930259cc7ad59d0a37c2ef95" }
bytemuck = { workspace = true, features = ["extern_crate_alloc"] }
bytes.workspace = true
digest.workspace = true
either.workspace = true
getset.workspace = true
itertools.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true

[dev-dependencies]
anyhow.workspace = true
binius-circuits = { git = "https://github.com/wu-s-john/binius64.git", rev = "2b27daea4a893fab930259cc7ad59d0a37c2ef95" }
binius-frontend = { git = "https://github.com/wu-s-john/binius64.git", rev = "2b27daea4a893fab930259cc7ad59d0a37c2ef95" }
binius-math = { git = "https://github.com/wu-s-john/binius64.git", rev = "2b27daea4a893fab930259cc7ad59d0a37c2ef95", features = ["test-utils"] }
criterion.workspace = true
proptest.workspace = true
rand = { workspace = true, features = ["thread_rng"] }
sha2.workspace = true

[lib]
bench = false

[[bench]]
name = "sumcheck"
harness = false

[[bench]]
name = "batch_quadratic_mle"
harness = false

[[bench]]
name = "and_reduction"
harness = false

[[bench]]
name = "shift_reduction"
harness = false

[[bench]]
name = "intmul"
harness = false

[[bench]]
name = "binmul"
harness = false

[[bench]]
name = "fold_words"
harness = false

[[bench]]
name = "fold_across_words"
harness = false

[[bench]]
name = "ring_switch"
harness = false

[[bench]]
name = "prodcheck"
harness = false

[[bench]]
name = "fracaddcheck"
harness = false

[features]
default = []
rayon = ["binius-utils/rayon"]
