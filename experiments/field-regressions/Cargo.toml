[package]
name = "field-regressions"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
exclude = ["reference/6271724d/crypto-primitives"]

[[bin]]
name = "unified-api"
path = "src/unified_main.rs"
required-features = ["arithmetic-campaign"]

[[bin]]
name = "multiswap-arithmetic"
path = "src/multiswap_main.rs"
required-features = ["arithmetic-campaign"]

[dependencies]
f2z = { path = "../..", default-features = false, optional = true }
crypto-bigint = { version = "=0.7.5", optional = true }
crypto-primitives = { path = "reference/6271724d/crypto-primitives", features = ["std", "crypto_bigint", "rand"], optional = true }
thiserror = { version = "2", optional = true }
field = { path = "../../vendor/field" }
circuit = { path = "../../crates/circuit", default-features = false, optional = true }
flock-core = { path = "../../vendor/flock-mod/crates/flock-core" }
num-bigint = { version = "0.4", optional = true }
num-traits = "0.2"
rayon = "1.10"
serde_json = "1"

[dev-dependencies]
# Tests in the verbatim production arithmetic modules are compiled by cargo test.
crypto-primes = "=0.7.2"
rand = "0.10"

[patch."https://github.com/albert-garreta/flock-mod.git"]
flock-core = { path = "../../vendor/flock-mod/crates/flock-core" }

[features]
arithmetic-campaign = ["dep:f2z", "dep:circuit", "dep:num-bigint", "dep:crypto-bigint", "dep:crypto-primitives", "dep:thiserror"]
# run.py injects the frozen candidate dependency in its temporary manifest.
ntt-candidate = []
legacy-matrix = ["dep:circuit", "circuit/full", "dep:num-bigint"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
strip = false
