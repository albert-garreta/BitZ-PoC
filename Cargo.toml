[package]
name = "f2z"
version = "0.1.0"
edition = "2024"
description = "F2Z: integer-MLE-evaluation PCS over an F2 commitment via a GF(2^128) exponent-fold GKR forest, opened with a flock-backed ring-switch + recursive Ligerito PCS"
repository = "https://github.com/NethermindEth/f2z"

[dependencies]
clap = { version = "4", features = ["derive", "env", "string"], optional = true }
anyhow = "1"
crypto-primitives = { path = "vendor/crypto-primitives", features = ["std", "crypto_bigint", "rand"] }
crypto-bigint = "=0.7.5"
crypto-primes = "=0.7.2"
derive_more = { version = "2.1.1", features = ["full"] }
blake3 = { version = "1.8", features = ["rayon"] }
itertools = "0.14"
num-traits = "0.2"
num-bigint = "0.4"
num-integer = "0.1"
thiserror = "2.0"
rayon = { version = "1.10", optional = true }
rand = "0.10"
rand_core = "0.10"
# The ring-switch + recursive Ligerito opener (commit / Ligerito hot paths).
# Pinned to the flock fork so builds do not require a sibling checkout.
# The k=4 Johnson configuration is generated in this crate, so the dependency
# does not need a private `Slim3` enum variant; see README.md.
# flock-core itself pins bincode 1.3 and serde 1.
flock-core = { git = "https://github.com/albert-garreta/flock-mod.git", rev = "ed4c0cd9aceeae15248bf4f24a70d96fe37b2395" }
# The host proof stream carries flock's serde `LigeritoProof` as a
# length-prefixed bincode blob (bincode 1.3, matching flock's own pin).
bincode = "1.3"
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
# Backend-independent SHA-256/F2Z circuit synthesis, copied into this
# workspace so fresh checkouts do not require a sibling repository.
circuit = { path = "crates/circuit", default-features = false }

# Optional Plonky3 stack used by the PCS and native SHA-256 comparisons.
# Pin all P3 crates to one commit from the fork's f2z-benching branch.
p3-air = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", optional = true }
p3-baby-bear = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", optional = true }
p3-challenger = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", optional = true }
p3-commit = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", optional = true }
p3-dft = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", features = ["parallel"], optional = true }
p3-field = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", optional = true }
p3-fri = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", optional = true }
p3-goldilocks = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", optional = true }
p3-matrix = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", optional = true }
p3-merkle-tree = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", optional = true }
p3-multi-stark = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", optional = true }
p3-multilinear-util = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", optional = true }
p3-sha256-air = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", features = ["parallel"], optional = true }
p3-sumcheck = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", features = ["parallel"], optional = true }
p3-symmetric = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", optional = true }
p3-uni-stark = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", features = ["parallel"], optional = true }
p3-util = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", optional = true }
p3-whir = { git = "https://github.com/wu-s-john/plonky3.git", rev = "62f49209aec15ab060c83afbaf9eeb74d8c0c411", features = ["parallel"], optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"], optional = true }

# Benchmark-only native Limber adapters. The normal F2Z dependency graph does
# not include Bellpepper or either Limber PCS engine.
bellpepper = { version = "0.4.1", optional = true }
bellpepper-core = { version = "0.4.0", optional = true }
ff = { version = "0.13.1", features = ["derive", "bits"], optional = true }
limber = { git = "https://github.com/wu-s-john/limber-impl.git", rev = "861f10a6a4d705d92a9faf13a8f860d8ba057ca0", default-features = false, optional = true }
spartan2 = { git = "https://github.com/wu-s-john/Spartan2.git", rev = "d3e686ebc4554cabfbe6282ef3c91baba00f755f", default-features = false, features = ["sha256-ecdsa"], optional = true }

# Optional Binius64 stack for the PCS and native SHA-256 comparisons.
# Pin every crate to the same commit from the fork's f2z-benching branch.
binius-compute = { git = "https://github.com/wu-s-john/binius64", rev = "bc73510ed63bf47eec25d4d10ade84f1c1fe2790", optional = true }
binius-circuits = { git = "https://github.com/wu-s-john/binius64", rev = "bc73510ed63bf47eec25d4d10ade84f1c1fe2790", optional = true }
binius-core = { git = "https://github.com/wu-s-john/binius64", rev = "bc73510ed63bf47eec25d4d10ade84f1c1fe2790", optional = true }
binius-field = { git = "https://github.com/wu-s-john/binius64", rev = "bc73510ed63bf47eec25d4d10ade84f1c1fe2790", optional = true }
binius-frontend = { git = "https://github.com/wu-s-john/binius64", rev = "bc73510ed63bf47eec25d4d10ade84f1c1fe2790", optional = true }
binius-hash = { git = "https://github.com/wu-s-john/binius64", rev = "bc73510ed63bf47eec25d4d10ade84f1c1fe2790", optional = true }
binius-iop = { git = "https://github.com/wu-s-john/binius64", rev = "bc73510ed63bf47eec25d4d10ade84f1c1fe2790", optional = true }
binius-iop-prover = { git = "https://github.com/wu-s-john/binius64", rev = "bc73510ed63bf47eec25d4d10ade84f1c1fe2790", optional = true }
binius-ip = { git = "https://github.com/wu-s-john/binius64", rev = "bc73510ed63bf47eec25d4d10ade84f1c1fe2790", optional = true }
binius-ip-prover = { git = "https://github.com/wu-s-john/binius64", rev = "bc73510ed63bf47eec25d4d10ade84f1c1fe2790", optional = true }
binius-math = { git = "https://github.com/wu-s-john/binius64", rev = "bc73510ed63bf47eec25d4d10ade84f1c1fe2790", optional = true }
binius-prover = { git = "https://github.com/wu-s-john/binius64", rev = "bc73510ed63bf47eec25d4d10ade84f1c1fe2790", optional = true }
binius-transcript = { git = "https://github.com/wu-s-john/binius64", rev = "bc73510ed63bf47eec25d4d10ade84f1c1fe2790", optional = true }
binius-utils = { git = "https://github.com/wu-s-john/binius64", rev = "bc73510ed63bf47eec25d4d10ade84f1c1fe2790", optional = true }
binius-verifier = { git = "https://github.com/wu-s-john/binius64", rev = "bc73510ed63bf47eec25d4d10ade84f1c1fe2790", optional = true }
tracing = "0.1.38"
tracing-subscriber = { version = "0.3.18", optional = true }
perfetto-sdk = { version = "1.1.1", optional = true }
tracing-perfetto-sdk = { version = "1.0.0", optional = true }
csv = { version = "1.4", optional = true }

[dev-dependencies]
clap = { version = "4", features = ["derive", "env", "string"] }
csv = "1.4"
libc = "0.2"
p256 = { version = "0.13.2", features = ["ecdsa"] }
sha2 = "0.10"
tempfile = "3"

[[bench]]
name = "sha256_ecdsa"
harness = false
required-features = ["span-metrics", "ecdsa"]

[[bench]]
name = "sha256_ecdsa_compare"
harness = false
required-features = ["span-metrics", "sha256-ecdsa-compare"]

[[bench]]
name = "pcs"
required-features = ["span-metrics"]
harness = false
# Plain-main bench (no criterion): commit/prove/verify timings, serialized
# proof size + codec round-trip, and peak heap per phase. Shapes via
# F2Z_BENCH_SHAPES ("t:s:W" triples), reps via F2Z_BENCH_REPS.

[[bench]]
name = "field"
required-features = ["span-metrics"]
harness = false
# GF(2^128)-GHASH vs GF(2^127)-b127 head-to-head on the prover's hot
# patterns (batch/chain mul, squares, comb powers, wide-dot, eqf kernels).
# Reps via F2Z_BENCH_REPS.

[[bench]]
name = "cm_and"
required-features = ["span-metrics"]
harness = false
# CM-AND relation (paper \Relation_CM): batched 32-bit x AND y = z via ONE
# linear constraint per gate, with w = x XOR y as an F2-VIRTUAL block -
# committed bits are x|y|z only, w is derived by the virtual F2Z opening.
# Exponents via F2Z_CM_EXPONENTS; reps via F2Z_BENCH_REPS.

[[bench]]
name = "u32_mul"
required-features = ["span-metrics"]
harness = false
# Integer u32×u32→u64 R1CS through the Spartan PIOP, with the terminal
# assignment claim discharged against the compact F2 witness by F2Z. The
# canonical protocol is commit-before-prime with a transcript-sampled Step-2
# prime, Lambda100 profile (F2Z_BENCH_LAMBDA selects another), and K=3
# univariate-prefix skip. Unified output schema (docs/bench-schema.md).
# Exponents via F2Z_BENCH_SHAPES; reps via F2Z_BENCH_REPS.

[[bench]]
name = "baby_bear_mul"
required-features = ["span-metrics"]
harness = false
# Independent BabyBear multiplications (a*b = c + p*k) through the PAPER
# path (transcript-sampled Step-2 prime), TWO rows per shape on one
# witness: Lambda100 and Lambda128 (or the one F2Z_BENCH_LAMBDA selects).
# Unified output schema (docs/bench-schema.md). Exponents via
# F2Z_BENCH_SHAPES (alias F2Z_BABY_BEAR_MUL_EXPONENTS); reps via
# F2Z_BENCH_REPS.

[[bench]]
name = "baby_bear_pcs_compare"
harness = false
required-features = ["span-metrics", "bench-internals", "plonky3-whir-bench", "binius64-bench"]

[[bench]]
name = "u32_pcs_compare"
harness = false
required-features = ["span-metrics", "bench-internals", "plonky3-whir-bench", "binius64-bench"]

[[bench]]
name = "u32_mul_inner_policy"
harness = false
required-features = ["span-metrics", "bench-internals"]
# Controlled PIOP-only sweep with a fixed delayed-Barrett outer sumcheck.
# It varies native witness folding and field coefficient accumulation only.

[[bench]]
name = "eq_tables"
harness = false
required-features = ["span-metrics", "bench-internals"]
# Controlled legacy-versus-current equality-table builder benchmark.
# Widths 8, 12, and 16; alternating median samples and explicit PR 1 gates.

[[bench]]
name = "u32_mul_outer_skip"
required-features = ["span-metrics"]
harness = false
# Controlled PIOP-only comparison of the standard outer sumcheck against
# known-zero univariate prefix skips K=1,2,3,4 (the canonical adapter uses K=3).

[[bench]]
name = "multiswap"
required-features = ["span-metrics"]
harness = false
# Limber's wired MultiSwap Mod-R1CS (6209 rows, k=0) through Spartan over a
# transcript-sampled 113-bit prime + the runtime-prime F2Z bit opening.
# Unified output schema (docs/bench-schema.md). Reps via F2Z_BENCH_REPS
# (alias F2Z_MULTISWAP_REPS); profile via F2Z_BENCH_LAMBDA (114 = the
# pinned Limber114, the only two-prime profile); run RAYON_NUM_THREADS=1
# for Limber parity.

[[bench]]
name = "lambda_sweep"
required-features = ["span-metrics"]
harness = false
# One SHA-256 witness proved under Lambda100 / Sha128ReferenceSchedule /
# Lambda128 (compile-time profiles) in the unified schema - the
# prover-time / proof-size tradeoff table for the security target.
# F2Z_BENCH_LAMBDA restricts the run to one of them. Exponent via
# F2Z_BENCH_SHAPES (default 12); reps via F2Z_BENCH_REPS.

[[bench]]
name = "sha256_compressions"
required-features = ["span-metrics"]
harness = false
# Independent SHA-256 compression batches through the structured Spartan +
# virtual F2Z path. Unified output schema (docs/bench-schema.md). Exponents
# via F2Z_BENCH_SHAPES (alias F2Z_SHA_LOG2S); reps via F2Z_BENCH_REPS
# (alias F2Z_SHA_REPS); profile via F2Z_BENCH_LAMBDA.

[[bench]]
name = "sha256_chain"
required-features = ["span-metrics"]
harness = false
# CHAINED SHA-256 compressions (the Merkle–Damgård chain over 2^k blocks,
# intermediate chaining values as witness) through the same linear PIOP +
# direct product opening, on the chained virtual map. Unified output
# schema (docs/bench-schema.md). Exponents via F2Z_BENCH_SHAPES; reps via
# F2Z_BENCH_REPS; profile via F2Z_BENCH_LAMBDA.

[[bench]]
name = "sha256_e2e_compare"
harness = false
required-features = ["span-metrics", "bench-internals", "native-sha256-compare"]
# Claim-equivalent fixed-IV native SHA-256 comparison across F2Z, full
# Plonky3 SHA AIR/WHIR, Binius64, and integer-mod Limber/Brakedown.
# Exponents via F2Z_SHA_COMPARE_EXPONENTS (default 7,8,10..16), one warmup and
# 21 measured verified samples by default.

[[bench]]
name = "hybrid_u32_sha256"
harness = false
required-features = ["span-metrics", "hybrid"]
# Shared-opening hybrid, separate BitZ + Binius, and all-Binius comparison.
# Chained SHA-256 plus x*y = z + 2^32*w with four u32 limbs.
# Counts and repetitions via --mul-log, --sha-log, and --iterations.

[[bench]]
name = "mul_e2e_compare"
harness = false
required-features = ["span-metrics", "bench-internals", "native-mul-compare"]

[[bench]]
name = "mul_witness_compare"
harness = false
required-features = ["span-metrics", "bench-internals", "native-mul-compare"]

[[test]]
name = "native_mul_compare"
path = "tests/native_mul_compare.rs"
required-features = ["bench-internals", "native-mul-compare"]

[[test]]
name = "benchmark_reporting"
path = "tests/benchmark_reporting.rs"
required-features = ["bench-internals", "native-mul-compare", "sha256-ecdsa-compare", "hybrid"]

[[test]]
name = "benchmark_perfetto"
required-features = ["bench-perfetto"]

[[test]]
name = "native_sha256_compare"
path = "tests/native_sha256_compare.rs"
required-features = ["bench-internals", "native-sha256-compare"]

[[bench]]
name = "sha256_product_layout"
harness = false
required-features = ["span-metrics", "bench-internals"]
# Fixed-q controlled sweep for 2^14 compressions and t+s=29. Defaults to
# t=7..=27, one warmup + 21 samples; t=28 is memory-skipped. Select t with
# F2Z_SHA_PRODUCT_TS.

