[package]
name = "f2z"
version = "0.1.0"
edition = "2024"
description = "F2Z: integer-MLE-evaluation PCS over an F2 commitment via a GF(2^128) exponent-fold GKR forest, opened with a flock-backed ring-switch + recursive Ligerito PCS"
repository = "https://github.com/NethermindEth/f2z"

[dependencies]
crypto-primitives = { path = "vendor/crypto-primitives", features = ["std", "crypto_bigint", "rand"] }
crypto-bigint = "=0.7.5"
crypto-primes = "=0.7.2"
derive_more = { version = "2.1.1", features = ["full"] }
blake3 = { version = "1.8", features = ["rayon"] }
itertools = "0.14"
num-traits = "0.2"
num-bigint = "0.4"
num-integer = "0.1"
thiserror = "2.0"
rayon = { version = "1.10", optional = true }
rand = "0.10"
rand_core = "0.10"
# The ring-switch + recursive Ligerito opener (commit / Ligerito hot paths).
# Kept as a portable LOCAL PATH dependency on the sibling flock checkout.
# The k=4 Johnson configuration is generated in this crate, so the dependency
# does not need a private `Slim3` enum variant; see README.md.
# flock-core itself pins bincode 1.3 and serde 1.
flock-core = { git = "https://github.com/albert-garreta/flock-mod.git", rev = "ed4c0cd9aceeae15248bf4f24a70d96fe37b2395" }
# The host proof stream carries flock's serde `LigeritoProof` as a
# length-prefixed bincode blob (bincode 1.3, matching flock's own pin).
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
# Backend-independent SHA-256/F2Z circuit synthesis. The same crate powers
# `../f2z-benchmark`; using it here keeps symbolic constraints and witness
# generation on one specification.
circuit = { path = "/private/tmp/claude-501/-Users-albertgarretafontelles-f2z-pcs/de380bc3-44c4-46f2-8775-aead6491a8d4/scratchpad/f2zb-main/crates/circuit", default-features = false }

[dev-dependencies]
serde_json = "1"

[[bench]]
name = "pcs"
harness = false
# Plain-main bench (no criterion): commit/prove/verify timings, serialized
# proof size + codec round-trip, and peak heap per phase. Shapes via
# F2Z_BENCH_SHAPES ("t:s:W" triples), reps via F2Z_BENCH_REPS.

[[bench]]
name = "field"
harness = false
# GF(2^128)-GHASH vs GF(2^127)-b127 head-to-head on the prover's hot
# patterns (batch/chain mul, squares, comb powers, wide-dot, eqf kernels).
# Reps via F2Z_BENCH_REPS.

[[bench]]
name = "cm_and"
harness = false
# CM-AND relation (paper \Relation_CM): batched 32-bit x AND y = z via ONE
# linear constraint per gate, with w = x XOR y as an F2-VIRTUAL block -
# committed bits are x|y|z only, w is derived by the virtual F2Z opening.
# Exponents via F2Z_CM_EXPONENTS; reps via F2Z_BENCH_REPS.

[[bench]]
name = "u32_mul"
harness = false
# Integer u32×u32→u64 R1CS through the generic Spartan PIOP, with the
# terminal assignment claim discharged against the compact F2 witness by F2Z.
# Exponents via F2Z_MUL_EXPONENTS; reps via F2Z_BENCH_REPS.

[[bench]]
name = "u32_mul_inner_policy"
harness = false
required-features = ["bench-internals"]
# Controlled PIOP-only sweep with a fixed delayed-Barrett outer sumcheck.
# It varies native witness folding and field coefficient accumulation only.

[[bench]]
name = "eq_tables"
harness = false
required-features = ["bench-internals"]
# Controlled legacy-versus-current equality-table builder benchmark.
# Widths 8, 12, and 16; alternating median samples and explicit PR 1 gates.

[[bench]]
name = "u32_mul_outer_skip"
harness = false
# Controlled PIOP-only comparison of the standard outer sumcheck against the
# opt-in known-zero univariate prefix skip for K=1,2,3,4.

[[bench]]
name = "multiswap"
harness = false
# Limber's wired MultiSwap Mod-R1CS (6209 rows, k=0) through Spartan over a
# transcript-sampled 113-bit prime + the runtime-prime F2Z bit opening.
# Reps via F2Z_MULTISWAP_REPS; run RAYON_NUM_THREADS=1 for Limber parity.

[[bench]]
name = "sha256_compressions"
harness = false
# Independent SHA-256 compression batches through the structured Spartan +
# virtual F2Z path. Exponents via F2Z_SHA_LOG2S; reps via F2Z_SHA_REPS.

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
unchecked = []
# Benchmark-only allocator instrumentation. The latency binary deliberately
# omits this feature so allocation accounting cannot bias the timing gate.
bench-peak-memory = []
# Exposes narrowly scoped policy controls used by controlled benchmark binaries.
bench-internals = []

# Match the upstream zinc-plus release profile — without fat LTO +
# codegen-units=1 the vendored field kernels and the sumcheck driver lose
# cross-unit inlining, measured ~1.2-1.5x slower at matched shapes.
[profile.release]
lto = true
codegen-units = 1

# Release-equivalent benchmark codegen with profiler-readable DWARF. Keeping
# symbols in the built-in bench profile lets xctrace resolve Rust hot paths.
[profile.bench]
debug = 2
strip = false
split-debuginfo = "unpacked"

# Release codegen + DWARF, for profilers (sample/samply). Separate target
# dir, so alternating profile/measure runs never invalidates release caches.
[profile.profiling]
inherits = "release"
debug = 2
