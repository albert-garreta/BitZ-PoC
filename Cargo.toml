[features]
default = ["parallel"]
# Numeric span metrics require the native trace processor at runtime.
span-metrics = ["dep:perfetto-sdk", "dep:tracing-perfetto-sdk", "dep:tracing-subscriber", "dep:csv"]
# Additionally save per-trial diagnostic artifacts through BenchmarkOutput.
bench-perfetto = ["span-metrics"]
hybrid = ["span-metrics", "binius64-bench", "dep:csv", "dep:clap"]
parallel = ["dep:rayon"]
unchecked = []
# Benchmark-only allocator instrumentation. The latency binary deliberately
# omits this feature so allocation accounting cannot bias the timing gate.
bench-peak-memory = []
# Exposes narrowly scoped policy controls used by controlled benchmark binaries.
bench-internals = []
# Composed SHA-256/P-256 arithmetization and its split Spartan adapter.
ecdsa = ["circuit/full"]
sha256-ecdsa-compare = ["span-metrics", "ecdsa", "parallel", "dep:spartan2"]
# Enables the Plonky3 BabyBear/Goldilocks WHIR stack for the controlled PCS
# comparison without adding it to normal library or benchmark builds.
plonky3-whir-bench = [
    "dep:p3-baby-bear",
    "dep:p3-challenger",
    "dep:p3-commit",
    "dep:p3-dft",
    "dep:p3-field",
    "dep:p3-goldilocks",
    "dep:p3-matrix",
    "dep:p3-merkle-tree",
    "dep:p3-multilinear-util",
    "dep:p3-sumcheck",
    "dep:p3-symmetric",
    "dep:p3-whir",
    "dep:postcard",
]
plonky3-sha256-bench = [
    "plonky3-whir-bench",
    "dep:p3-air",
    "dep:p3-multi-stark",
    "dep:p3-sha256-air",
    "dep:p3-util",
]
# Univariate Goldilocks STARK + FRI for independent wrapping u32 multiplication.
plonky3-fri-bench = [
    "dep:p3-air",
    "dep:p3-challenger",
    "dep:p3-commit",
    "dep:p3-dft",
    "dep:p3-field",
    "dep:p3-fri",
    "dep:p3-goldilocks",
    "dep:p3-matrix",
    "dep:p3-merkle-tree",
    "dep:p3-symmetric",
    "dep:p3-uni-stark",
    "dep:postcard",
]
native-mul-compare = [
    "span-metrics",
    "plonky3-fri-bench",
    "plonky3-whir-bench",
    "dep:p3-air",
    "dep:p3-multi-stark",
    "binius64-bench",
    # Limber's own wrapping-multiplication rows, proved in process through
    # its Brakedown Mod-PCS engine (benches/mul_e2e_compare/limber.rs).
    "dep:limber",
]
native-sha256-compare = [
    "span-metrics",
    "plonky3-sha256-bench",
    "binius64-bench",
    "dep:bellpepper",
    "dep:bellpepper-core",
    "dep:ff",
    "dep:limber",
]
# Selects the audited degree-4/unique-decoding WHIR comparison profile.  The
# default `plonky3-whir-bench` profile remains degree-5/Johnson-bound so normal
# comparison invocations keep their existing configuration.
plonky3-whir-degree4-bench = ["plonky3-whir-bench"]
# Selects the degree-2 Goldilocks challenge field for the u32 WHIR campaign.
# Without it the u32 adapter uses the degree-5 Goldilocks extension.
plonky3-whir-goldilocks-degree2-bench = ["plonky3-whir-bench"]
# Enables the Binius64 BaseFold + ring-switch benchmark adapter.
binius64-bench = [
    "dep:binius-compute",
    "dep:binius-circuits",
    "dep:binius-core",
    "dep:binius-field",
    "dep:binius-frontend",
    "dep:binius-hash",
    "dep:binius-iop",
    "dep:binius-iop-prover",
    "dep:binius-ip",
    "dep:binius-ip-prover",
    "dep:binius-math",
    "dep:binius-prover",
    "dep:binius-transcript",
    "dep:binius-utils",
    "dep:binius-verifier",
    "dep:tracing-subscriber",
]

# Match the upstream zinc-plus release profile — without fat LTO +
# codegen-units=1 the vendored field kernels and the sumcheck driver lose
# cross-unit inlining, measured ~1.2-1.5x slower at matched shapes.
[profile.release]
lto = true
codegen-units = 1

# The root manifest owns patch resolution for benchmark-only Git
# dependencies. Limber relies on this halo2curves revision for its mixed-add
# API, so mirror its pin here.
[patch.crates-io]
halo2curves = { git = "https://github.com/privacy-ethereum/halo2curves.git", rev = "02c235f0bb52800c28d9c3370400b5435dbe2220" }

[patch."https://github.com/albert-garreta/flock-mod.git"]
flock-core = { path = "vendor/flock-mod/crates/flock-core" }

# Release-equivalent benchmark codegen with profiler-readable DWARF. Keeping
# symbols in the built-in bench profile lets xctrace resolve Rust hot paths.
[profile.bench]
lto = true
codegen-units = 1
debug = 2
strip = false
split-debuginfo = "unpacked"

# Release codegen + DWARF, for profilers (sample/samply). Separate target
# dir, so alternating profile/measure runs never invalidates release caches.
[profile.profiling]
inherits = "release"
debug = 2

