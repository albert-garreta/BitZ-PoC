[package]
name = "f2z"
version = "0.1.0"
edition = "2024"
description = "F2Z: integer-MLE-evaluation PCS over an F2 commitment via a GF(2^128) exponent-fold GKR forest, opened with a flock-backed ring-switch + recursive Ligerito PCS"
repository = "https://github.com/NethermindEth/f2z"

[dependencies]
crypto-primitives = { git = "https://github.com/NethermindEth/crypto-primitives.git", rev = "2cf39db886a76dc3e961cbb9c86fb5ab042381ef", features = ["std", "crypto_bigint", "rand"] }
crypto-bigint = "=0.7.0-rc.9"
crypto-primes = "=0.7.0-pre.3"
derive_more = { version = "2.1.1", features = ["full"] }
blake3 = { version = "1.8", features = ["rayon"] }
itertools = "0.14"
num-traits = "0.2"
thiserror = "2.0"
rayon = { version = "1.10", optional = true }
rand = "0.9"
rand_core = "0.9"
# The ring-switch + recursive Ligerito opener (commit / BaseFold / Ligerito
# hot paths). Pinned as a LOCAL PATH dependency, exactly as zinc-plus pins it;
# see README.md. flock-core itself pins bincode 1.3 and serde 1.
flock-core = { path = "/Users/albertgarretafontelles/flock/crates/flock-core" }
# The host proof stream carries flock's serde `LigeritoProof` as a
# length-prefixed bincode blob (bincode 1.3, matching flock's own pin).
bincode = "1.3"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]

[[bench]]
name = "pcs"
harness = false
# Plain-main bench (no criterion): commit/prove/verify timings, serialized
# proof size + codec round-trip, and peak heap per phase. Shapes via
# F2Z_BENCH_SHAPES ("t:s:W" triples), reps via F2Z_BENCH_REPS.

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
unchecked = []

# Match the upstream zinc-plus release profile — without fat LTO +
# codegen-units=1 the vendored field kernels and the sumcheck driver lose
# cross-unit inlining, measured ~1.2-1.5x slower at matched shapes.
[profile.release]
lto = true
codegen-units = 1
