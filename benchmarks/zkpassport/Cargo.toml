[package]
name = "zkpassport-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
csv = "1.4"
noir_rs = { git = "https://github.com/zkpassport/noir_rs", rev = "8e516b2ffb126b5cd779d2b22e596c2e1de4e251", features = ["barretenberg"] }
noirc_abi = { git = "https://github.com/noir-lang/noir.git", rev = "v1.0.0-beta.22" }
p256 = { version = "0.13", features = ["ecdsa"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
barretenberg-rs = { version = "=5.0.0", default-features = false, features = ["ffi"] }

[profile.release]
opt-level = 3
lto = "thin"
