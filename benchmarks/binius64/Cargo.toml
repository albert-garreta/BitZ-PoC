[package]
name = "binius64-sha256-ecdsa"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
binius-circuits = { git = "https://github.com/wu-s-john/binius64", rev = "938eadcdfa1c2902f207e75bf6510d74db51602d" }
binius-core = { git = "https://github.com/wu-s-john/binius64", rev = "938eadcdfa1c2902f207e75bf6510d74db51602d" }
binius-frontend = { git = "https://github.com/wu-s-john/binius64", rev = "938eadcdfa1c2902f207e75bf6510d74db51602d" }
binius-hash = { git = "https://github.com/wu-s-john/binius64", rev = "938eadcdfa1c2902f207e75bf6510d74db51602d" }
binius-prover = { git = "https://github.com/wu-s-john/binius64", rev = "938eadcdfa1c2902f207e75bf6510d74db51602d" }
binius-verifier = { git = "https://github.com/wu-s-john/binius64", rev = "938eadcdfa1c2902f207e75bf6510d74db51602d" }
binius-transcript = { git = "https://github.com/wu-s-john/binius64", rev = "938eadcdfa1c2902f207e75bf6510d74db51602d" }
blake3 = "1.8"
p256 = { version = "0.13.2", features = ["ecdsa"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
sha2 = "0.10"

[profile.release]
debug = 1
